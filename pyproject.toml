[project]
name = "graphrag"
version = "0.1.0"
description = "A GraphRAG system built from scratch"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
ray = ["ray>=2.40"]
dask = ["dask>=2024.12"]
embeddings = ["sentence-transformers>=6.1.0"]
# GPU wheels are platform-specific. Install them through
# scripts/setup_acceleration.ps1 rather than locking every machine to CPU/CUDA.
gpu = ["sentence-transformers>=6.1.0"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
